<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTI PANEL — Kelola Staff</title>
    <script>
        if (localStorage.getItem('rti_panel_theme') === 'light') {
            document.documentElement.style.background = '#f1f5f9';
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .staff-section-title {
            font-family: 'Syne', sans-serif;
            font-size: 11px; font-weight: 800;
            color: var(--text3);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 4px 0 8px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 8px;
        }
        .staff-list {
            display: flex; flex-direction: column; gap: 6px;
            margin-bottom: 20px;
        }
        .staff-row {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            transition: border-color 0.2s;
        }
        .staff-row:hover { border-color: var(--border2); }
        .staff-num {
            font-family: 'Syne', sans-serif;
            font-size: 11px; font-weight: 800;
            color: var(--text3);
            width: 28px; flex-shrink: 0;
        }
        .staff-jabatan {
            font-size: 12px; color: var(--text2);
            flex: 1; min-width: 0;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .staff-nama-input {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 7px 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px; font-weight: 500;
            color: var(--text);
            width: 130px; flex-shrink: 0;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }
        .staff-nama-input::placeholder { color: var(--text3); font-size: 12px; }
        .staff-nama-input:focus {
            border-color: rgba(52,211,153,0.4);
            background: rgba(52,211,153,0.04);
        }
        .staff-nama-input.saved {
            border-color: rgba(52,211,153,0.4);
            background: rgba(52,211,153,0.04);
        }
        .save-btn {
            width: 30px; height: 30px; flex-shrink: 0;
            background: var(--accent-dim);
            border: 1px solid rgba(52,211,153,0.2);
            border-radius: 8px;
            color: var(--accent);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s;
        }
        .save-btn:hover { background: var(--accent); color: #052e16; }
        .save-btn.saving { opacity: 0.6; pointer-events: none; }
        .toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: #052e16;
            border: 1px solid rgba(52,211,153,0.3);
            color: var(--accent);
            padding: 10px 20px;
            border-radius: 99px;
            font-size: 13px; font-weight: 500;
            z-index: 999;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s;
            white-space: nowrap;
        }
        .toast.show { opacity: 1; }
        .debug-box {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(52,211,153,0.3);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            font-size: 11px;
            color: #34d399;
            word-break: break-all;
            line-height: 1.8;
        }
        body.light .staff-row { background: rgba(0,0,0,0.02); }
        body.light .staff-nama-input { background: rgba(0,0,0,0.03); color: var(--text); }
        body.light .toast { background: #d1fae5; color: #065f46; }
    </style>
</head>
<body class="panel-body">

    <div class="bg-grid"></div>

    <header class="panel-header">
        <div class="panel-header-inner">
            <button id="hamburger" class="hamburger-btn">
                <span></span><span></span><span></span>
            </button>
            <div class="panel-logo">RTI<span>.PANEL</span></div>
            <div class="header-admin">
                <div class="header-admin-text">
                    <span id="header-name" class="header-admin-name"></span>
                    <span id="header-email" class="header-admin-email"></span>
                </div>
                <div class="header-avatar-wrap">
                    <img id="header-photo" src="" alt="" class="header-avatar hidden">
                    <div id="header-fallback" class="header-avatar-fallback hidden">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div id="sidebar-overlay" class="sidebar-overlay"></div>
    <aside id="sidebar" class="panel-sidebar">
        <div class="sidebar-head">
            <div class="sidebar-admin-card">
                <div class="sidebar-avatar-wrap">
                    <img id="sidebar-photo" src="" alt="" class="sidebar-avatar hidden">
                    <div id="sidebar-fallback" class="sidebar-avatar-fallback hidden">
                        <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                    </div>
                </div>
                <div>
                    <p id="sidebar-name" class="sidebar-admin-name"></p>
                    <p id="sidebar-email" class="sidebar-admin-email"></p>
                </div>
            </div>
        </div>
        <div class="sidebar-divider"></div>
        <nav class="sidebar-nav">
            <a href="panel.html" class="sidebar-item">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span>Dashboard</span>
            </a>
            <a href="staff-panel.html" class="sidebar-item active">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span>Kelola Staff</span>
            </a>
            <a href="setting.html" class="sidebar-item">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span>Pengaturan</span>
            </a>
        </nav>
        <div class="sidebar-divider"></div>
        <button id="logout-btn" class="sidebar-logout">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            <span>Keluar</span>
        </button>
        <p class="sidebar-version">RTI Dashboard v1.0</p>
    </aside>

    <main class="panel-main">
        <div class="panel-welcome">
            <div>
                <h2 class="welcome-title">Kelola <span class="accent">Staff</span></h2>
                <p class="welcome-sub">Edit nama staff langsung dari sini, otomatis update di halaman publik.</p>
            </div>
        </div>

        <div class="cards-grid">
            <div class="panel-card">
                <div class="card-header">
                    <div class="card-icon-wrap recruit-icon">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                    </div>
                    <div>
                        <h3 class="card-title">Daftar Staff RTI</h3>
                        <p class="card-sub">Klik ✓ atau Enter untuk simpan perubahan nama</p>
                    </div>
                </div>

                <div id="loading-state" class="text-center py-8">
                    <div class="saving-dot" style="margin:0 auto 8px;width:12px;height:12px;"></div>
                    <p style="font-size:13px;color:var(--text3);">Memuat data staff...</p>
                </div>

                <div id="staff-container" class="hidden"></div>
            </div>
        </div>
    </main>

    <div id="toast" class="toast"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, orderBy, query } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const app = initializeApp({
            apiKey: "AIzaSyBFbXa_03QYM8DlBkDw7UMZttBMABdtdf4",
            authDomain: "rti-dashboard-7cd8f.firebaseapp.com",
            projectId: "rti-dashboard-7cd8f",
            storageBucket: "rti-dashboard-7cd8f.firebasestorage.app",
            messagingSenderId: "328210653829",
            appId: "1:328210653829:web:2796c8a0995bfdf232bfec"
        });
        const auth = getAuth(app);
        const db = getFirestore(app);

        const sessionRaw = sessionStorage.getItem('rti_admin');
        if (!sessionRaw) { window.location.href = 'index.html'; }
        const { name, email, photo } = JSON.parse(sessionRaw);

        function fillUser(nameEl, emailEl, photoEl, fallbackEl) {
            if (nameEl) nameEl.textContent = name || 'Admin';
            if (emailEl) emailEl.textContent = email || '';
            if (photo && photoEl) {
                photoEl.src = photo;
                photoEl.classList.remove('hidden');
                photoEl.onerror = () => {
                    photoEl.classList.add('hidden');
                    if (fallbackEl) fallbackEl.classList.remove('hidden');
                };
            } else if (fallbackEl) {
                fallbackEl.classList.remove('hidden');
            }
        }

        fillUser(
            document.getElementById('header-name'),
            document.getElementById('header-email'),
            document.getElementById('header-photo'),
            document.getElementById('header-fallback')
        );
        fillUser(
            document.getElementById('sidebar-name'),
            document.getElementById('sidebar-email'),
            document.getElementById('sidebar-photo'),
            document.getElementById('sidebar-fallback')
        );

        document.body.classList.toggle('light', (localStorage.getItem('rti_panel_theme') || 'dark') === 'light');

        const SECTION_LABELS = { founder: 'Founder', director: 'Directors', core: 'Core Staff', staff: 'Staff' };
        const SECTION_ORDER = ['founder', 'director', 'core', 'staff'];

        async function loadStaff() {
            try {
                const q = query(collection(db, 'stafflist'), orderBy('Urutan'));
                const snap = await getDocs(q);

                // ── DEBUG: tampil di layar ──
                const debugInfo = snap.docs.map(d => {
                    const data = d.data();
                    return `${d.id} → Tipe:${data.Tipe||data.tipe||'?'} Jabatan:${data.Jabatan||data.jabatan||'?'} Nama:${data.Nama||data.nama||'?'}`;
                }).join('<br>');

                document.getElementById('loading-state').innerHTML = `
                    <div class="debug-box">
                        <b>DEBUG — ${snap.size} dokumen ditemukan:</b><br><br>
                        ${debugInfo || 'Tidak ada data'}
                    </div>
                    <p style="font-size:12px;color:var(--text3);">Memproses...</p>
                `;

                const grouped = { founder: [], director: [], core: [], staff: [] };
                snap.forEach(d => {
                    const raw = d.data();
                    const data = {
                        id: d.id,
                        jabatan: raw.Jabatan || raw.jabatan || '',
                        nama: raw.Nama || raw.nama || '',
                        tipe: (raw.Tipe || raw.tipe || '').toLowerCase(),
                        urutan: raw.Urutan || raw.urutan || 0
                    };
                    if (grouped[data.tipe] !== undefined) {
                        grouped[data.tipe].push(data);
                    }
                });

                const container = document.getElementById('staff-container');
                container.innerHTML = '';

                SECTION_ORDER.forEach(tipe => {
                    const items = grouped[tipe];
                    if (!items.length) return;

                    const title = document.createElement('div');
                    title.className = 'staff-section-title';
                    title.textContent = SECTION_LABELS[tipe];
                    container.appendChild(title);

                    const list = document.createElement('div');
                    list.className = 'staff-list';

                    items.forEach(item => {
                        const row = document.createElement('div');
                        row.className = 'staff-row';
                        row.innerHTML = `
                            <span class="staff-num">${item.id}</span>
                            <span class="staff-jabatan">${item.jabatan}</span>
                            <input class="staff-nama-input" type="text"
                                value="${item.nama}"
                                placeholder="— Kosong —"
                                data-id="${item.id}">
                            <button class="save-btn" data-id="${item.id}" title="Simpan">
                                <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
                                </svg>
                            </button>
                        `;
                        list.appendChild(row);
                    });

                    container.appendChild(list);
                });

                document.getElementById('loading-state').classList.add('hidden');
                container.classList.remove('hidden');

                container.querySelectorAll('.save-btn').forEach(btn => {
                    btn.addEventListener('click', () => saveNama(btn.dataset.id));
                });
                container.querySelectorAll('.staff-nama-input').forEach(inp => {
                    inp.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') saveNama(inp.dataset.id);
                    });
                });

            } catch(e) {
                document.getElementById('loading-state').innerHTML =
                    `<div class="debug-box" style="color:red;">Error: ${e.message}<br>Code: ${e.code || '-'}</div>`;
            }
        }

        async function saveNama(docId) {
            const input = document.querySelector(`.staff-nama-input[data-id="${docId}"]`);
            const btn = document.querySelector(`.save-btn[data-id="${docId}"]`);
            const newNama = input.value.trim();
            btn.classList.add('saving');
            try {
                await updateDoc(doc(db, 'stafflist', docId), { Nama: newNama });
                input.classList.add('saved');
                setTimeout(() => input.classList.remove('saved'), 2000);
                showToast(`✓ ${newNama || 'Kosong'} berhasil disimpan`);
            } catch(e) {
                showToast('Gagal simpan: ' + e.message);
            } finally {
                btn.classList.remove('saving');
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        loadStaff();

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await signOut(auth).catch(() => {});
            sessionStorage.removeItem('rti_admin');
            window.location.href = 'index.html';
        });

        const hamburger = document.getElementById('hamburger');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');

        hamburger.addEventListener('click', () => {
            const isOpen = sidebar.classList.contains('open');
            hamburger.classList.toggle('open', !isOpen);
            sidebar.classList.toggle('open', !isOpen);
            overlay.classList.toggle('open', !isOpen);
        });
        overlay.addEventListener('click', () => {
            hamburger.classList.remove('open');
            sidebar.classList.remove('open');
            overlay.classList.remove('open');
        });
    </script>
</body>
</html>
