<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTI PANEL — Pengaturan</title>
    <script>
        // Cegah flash tema
        if (localStorage.getItem('rti_panel_theme') === 'light') {
            document.documentElement.style.background = '#f1f5f9';
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ── Light mode ── */
        body.light {
            --bg:      #f1f5f9;
            --bg2:     #e2e8f0;
            --surface: #ffffff;
            --border:  rgba(0,0,0,0.08);
            --border2: rgba(0,0,0,0.14);
            --text:    #0f172a;
            --text2:   rgba(15,23,42,0.55);
            --text3:   rgba(15,23,42,0.3);
        }
        body.light .panel-header {
            background: rgba(241,245,249,0.85);
        }
        body.light .bg-grid {
            background-image:
                linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px);
        }
        body.light .hamburger-btn span { background: var(--text2); }
        body.light .panel-sidebar { background: #e2e8f0; }
        body.light .sidebar-admin-card { background: rgba(52,211,153,0.08); }

        /* ── Theme toggle card ── */
        .theme-icon {
            background: rgba(167,139,250,0.1);
            border: 1px solid rgba(167,139,250,0.15);
            color: #a78bfa;
        }
        .theme-toggle-wrap {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .theme-option {
            position: relative;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .theme-option:hover { border-color: var(--border2); }
        .theme-option.active {
            border-color: var(--accent);
            background: var(--accent-dim);
        }

        /* Preview mini */
        .theme-preview {
            width: 100%; height: 64px;
            border-radius: 6px; padding: 6px;
            display: flex; flex-direction: column; gap: 4px;
            overflow: hidden;
        }
        .dark-preview {
            background: #060d1a;
            border: 1px solid rgba(255,255,255,0.07);
        }
        .light-preview {
            background: #f1f5f9;
            border: 1px solid rgba(0,0,0,0.08);
        }
        .preview-bar {
            height: 8px; border-radius: 3px; width: 60%;
        }
        .dark-preview .preview-bar { background: rgba(255,255,255,0.15); }
        .light-preview .preview-bar { background: rgba(0,0,0,0.15); }
        .preview-card {
            height: 18px; border-radius: 3px; width: 100%;
        }
        .preview-card.short { width: 70%; }
        .dark-preview .preview-card { background: rgba(255,255,255,0.06); }
        .light-preview .preview-card { background: rgba(0,0,0,0.06); }

        .theme-option-label {
            display: flex; align-items: center; gap: 6px;
            font-size: 13px; font-weight: 500; color: var(--text2);
        }
        .theme-option.active .theme-option-label { color: var(--accent); }

        .theme-check {
            position: absolute; top: 8px; right: 8px;
            width: 18px; height: 18px; border-radius: 50%;
            background: var(--accent); color: #052e16;
            display: none; align-items: center; justify-content: center;
        }
        .theme-check.show { display: flex; }
    </style>
</head>
<body class="panel-body">

    <div class="bg-grid"></div>

    <!-- HEADER -->
    <header class="panel-header">
        <div class="panel-header-inner">
            <button id="hamburger" class="hamburger-btn" aria-label="Toggle menu">
                <span></span><span></span><span></span>
            </button>
            <div class="panel-logo">RTI<span>.PANEL</span></div>
            <div class="header-admin">
                <div class="header-admin-text">
                    <span id="header-name" class="header-admin-name"></span>
                    <span id="header-email" class="header-admin-email"></span>
                </div>
                <div class="header-avatar-wrap">
                    <img id="header-photo" src="" alt="" class="header-avatar hidden">
                    <div id="header-fallback" class="header-avatar-fallback hidden">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- SIDEBAR -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>
    <aside id="sidebar" class="panel-sidebar">
        <div class="sidebar-head">
            <div class="sidebar-admin-card">
                <div class="sidebar-avatar-wrap">
                    <img id="sidebar-photo" src="" alt="" class="sidebar-avatar hidden">
                    <div id="sidebar-fallback" class="sidebar-avatar-fallback hidden">
                        <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                    </div>
                </div>
                <div>
                    <p id="sidebar-name" class="sidebar-admin-name"></p>
                    <p id="sidebar-email" class="sidebar-admin-email"></p>
                </div>
            </div>
        </div>

        <div class="sidebar-divider"></div>

        <nav class="sidebar-nav">
            <a href="panel.html" class="sidebar-item">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                </svg>
                <span>Dashboard</span>
            </a>
            <a href="setting.html" class="sidebar-item active">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
                <span>Pengaturan</span>
            </a>
        </nav>

        <div class="sidebar-divider"></div>

        <button id="logout-btn" class="sidebar-logout">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
            </svg>
            <span>Keluar</span>
        </button>

        <p class="sidebar-version">RTI Dashboard v1.0</p>
    </aside>

    <!-- MAIN -->
    <main class="panel-main">

        <div class="panel-welcome">
            <div>
                <h2 class="welcome-title">Pengaturan <span class="accent">Panel</span></h2>
                <p class="welcome-sub">Sesuaikan tampilan dan preferensi panel admin.</p>
            </div>
        </div>

        <div class="cards-grid">

            <!-- Card: Tema -->
            <div class="panel-card">
                <div class="card-header">
                    <div class="card-icon-wrap theme-icon">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"></path>
                        </svg>
                    </div>
                    <div>
                        <h3 class="card-title">Tema Panel</h3>
                        <p class="card-sub">Pilih tampilan siang atau malam</p>
                    </div>
                </div>

                <div class="theme-toggle-wrap">
                    <!-- Malam -->
                    <div id="theme-dark" class="theme-option" onclick="setTheme('dark')">
                        <div class="theme-preview dark-preview">
                            <div class="preview-bar"></div>
                            <div class="preview-card"></div>
                            <div class="preview-card short"></div>
                        </div>
                        <div class="theme-option-label">
                            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                            </svg>
                            <span>Malam</span>
                        </div>
                        <div id="dark-check" class="theme-check">
                            <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                            </svg>
                        </div>
                    </div>

                    <!-- Siang -->
                    <div id="theme-light" class="theme-option" onclick="setTheme('light')">
                        <div class="theme-preview light-preview">
                            <div class="preview-bar"></div>
                            <div class="preview-card"></div>
                            <div class="preview-card short"></div>
                        </div>
                        <div class="theme-option-label">
                            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"></path>
                            </svg>
                            <span>Siang</span>
                        </div>
                        <div id="light-check" class="theme-check">
                            <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script type="module">
        import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";

        const app = initializeApp({
            apiKey: "AIzaSyBFbXa_03QYM8DlBkDw7UMZttBMABdtdf4",
            authDomain: "rti-dashboard-7cd8f.firebaseapp.com",
            projectId: "rti-dashboard-7cd8f",
            storageBucket: "rti-dashboard-7cd8f.firebasestorage.app",
            messagingSenderId: "328210653829",
            appId: "1:328210653829:web:2796c8a0995bfdf232bfec"
        });
        const auth = getAuth(app);

        // Cek sesi
        const sessionRaw = sessionStorage.getItem('rti_admin');
        if (!sessionRaw) { window.location.href = 'index.html'; }
        const session = JSON.parse(sessionRaw);
        const { name, email, photo } = session;

        // Isi user info
        function fillUser(nameEl, emailEl, photoEl, fallbackEl) {
            if (nameEl) nameEl.textContent = name || 'Admin';
            if (emailEl) emailEl.textContent = email || '';
            if (photo && photoEl) {
                photoEl.src = photo;
                photoEl.classList.remove('hidden');
                photoEl.onerror = () => {
                    photoEl.classList.add('hidden');
                    if (fallbackEl) fallbackEl.classList.remove('hidden');
                };
            } else if (fallbackEl) {
                fallbackEl.classList.remove('hidden');
            }
        }

        fillUser(
            document.getElementById('header-name'),
            document.getElementById('header-email'),
            document.getElementById('header-photo'),
            document.getElementById('header-fallback')
        );
        fillUser(
            document.getElementById('sidebar-name'),
            document.getElementById('sidebar-email'),
            document.getElementById('sidebar-photo'),
            document.getElementById('sidebar-fallback')
        );

        // ── Theme ──
        function applyTheme(theme) {
            const isDark = theme === 'dark';
            document.body.classList.toggle('light', !isDark);
            document.getElementById('theme-dark').classList.toggle('active', isDark);
            document.getElementById('theme-light').classList.toggle('active', !isDark);
            document.getElementById('dark-check').classList.toggle('show', isDark);
            document.getElementById('light-check').classList.toggle('show', !isDark);
        }

        window.setTheme = (theme) => {
            localStorage.setItem('rti_panel_theme', theme);
            applyTheme(theme);
        };

        // Load tema tersimpan
        applyTheme(localStorage.getItem('rti_panel_theme') || 'dark');

        // Logout
        document.getElementById('logout-btn').addEventListener('click', async () => {
            await signOut(auth).catch(() => {});
            sessionStorage.removeItem('rti_admin');
            window.location.href = 'index.html';
        });

        // Sidebar
        const hamburger = document.getElementById('hamburger');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');

        hamburger.addEventListener('click', () => {
            const isOpen = sidebar.classList.contains('open');
            hamburger.classList.toggle('open', !isOpen);
            sidebar.classList.toggle('open', !isOpen);
            overlay.classList.toggle('open', !isOpen);
        });
        overlay.addEventListener('click', () => {
            hamburger.classList.remove('open');
            sidebar.classList.remove('open');
            overlay.classList.remove('open');
        });
    </script>
</body>
</html>
