<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTI PANEL — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <div class="bg-grid"></div>
    <div class="bg-glow"></div>

    <div class="login-wrapper">

        <!-- Branding -->
        <div class="login-brand">
            <div class="brand-icon">
                <svg width="28" height="28" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                        d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z">
                    </path>
                </svg>
            </div>
            <div>
                <h1 class="brand-title">RTI<span>.PANEL</span></h1>
                <p class="brand-sub">Admin Access — Restricted</p>
            </div>
        </div>

        <!-- Login Card -->
        <div class="login-card">
            <div class="login-card-header">
                <h2>Masuk ke Panel</h2>
                <p>Isi email & password untuk lanjut</p>
            </div>

            <!-- Error Banner -->
            <div id="error-banner" class="error-banner hidden">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span id="error-text"></span>
            </div>

            <div class="login-form">

                <!-- EMAIL FIELD -->
                <div class="field-group">
                    <label class="field-label">Email Google Admin</label>

                    <!-- Wrapper posisi relative untuk overlay -->
                    <div class="google-field-wrap">

                        <!-- Tampilan field email (display only) -->
                        <div id="email-display" class="email-display empty">
                            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="flex-shrink:0;color:var(--text3)">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path>
                            </svg>
                            <span id="email-text" class="email-display-text">Klik untuk pilih akun Google</span>
                            <div class="google-badge">
                                <svg width="14" height="14" viewBox="0 0 24 24">
                                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                                </svg>
                                <span id="google-badge-text">Pilih</span>
                            </div>
                        </div>

                        <!-- Google GSI button — di-overlay di atas email-display, opacity 0 -->
                        <div id="gsi-container" class="gsi-overlay">
                            <!-- Google button di-render di sini via JS, opacity:0 tapi clickable -->
                        </div>
                    </div>
                </div>

                <!-- PASSWORD FIELD -->
                <div class="field-group">
                    <label class="field-label">Password Admin</label>
                    <div class="field-input-wrap">
                        <svg class="field-icon" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                        </svg>
                        <input id="input-password" type="password" placeholder="••••••••••" class="field-input">
                        <button id="toggle-pw-btn" class="toggle-pw-btn" type="button">
                            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- SUBMIT -->
                <button id="login-btn" class="login-btn" type="button">
                    <span id="login-btn-text">Masuk ke Panel</span>
                    <div id="login-spinner" class="spinner hidden"></div>
                    <svg id="login-arrow" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
                    </svg>
                </button>

            </div>
        </div>

        <p class="login-footer-note">RTI Dashboard v1.0 · Akses terbatas untuk admin</p>
    </div>

    <!-- Google GSI script -->
    <script src="https://accounts.google.com/gsi/client" async></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithCredential, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

        const app = initializeApp({
            apiKey: "AIzaSyBFbXa_03QYM8DlBkDw7UMZttBMABdtdf4",
            authDomain: "rti-dashboard-7cd8f.firebaseapp.com",
            projectId: "rti-dashboard-7cd8f",
            storageBucket: "rti-dashboard-7cd8f.firebasestorage.app",
            messagingSenderId: "328210653829",
            appId: "1:328210653829:web:2796c8a0995bfdf232bfec"
        });
        const auth = getAuth(app);

        const ADMIN_PASSWORD = "adminrti135";
        const ALLOWED_ADMINS = ["da4389490@gmail.com"];

        let googleUser = null;

        // ── Init Google GSI setelah script load ──
        function initGSI() {
            google.accounts.id.initialize({
                client_id: "328210653829-l7f5c1emca2hpkngkll0oqjo19hlnjta.apps.googleusercontent.com",
                callback: handleGoogleToken,
                auto_select: false,
                cancel_on_tap_outside: true
            });

            // Render button Google di dalam gsi-container
            // Button ini invisible (opacity 0) tapi seluruh areanya clickable
            google.accounts.id.renderButton(
                document.getElementById("gsi-container"),
                {
                    type: "standard",
                    size: "large",
                    width: 400, // lebar penuh container
                    text: "signin_with",
                    shape: "rectangular",
                    logo_alignment: "left"
                }
            );
        }

        // Tunggu GSI script siap
        if (window.google?.accounts?.id) {
            initGSI();
        } else {
            // Poll sampai GSI ready
            const poll = setInterval(() => {
                if (window.google?.accounts?.id) {
                    clearInterval(poll);
                    initGSI();
                }
            }, 100);
        }

        // ── Callback dari Google ──
        async function handleGoogleToken(response) {
            try {
                const credential = GoogleAuthProvider.credential(response.credential);
                const result = await signInWithCredential(auth, credential);
                const user = result.user;

                if (!ALLOWED_ADMINS.includes(user.email)) {
                    await signOut(auth);
                    showError('Akun ini tidak memiliki akses admin!');
                    resetEmailDisplay();
                    return;
                }

                googleUser = user;
                hideError();

                // Update tampilan email display
                const emailDisplay = document.getElementById('email-display');
                document.getElementById('email-text').textContent = user.email;
                document.getElementById('google-badge-text').textContent = 'Ganti';
                emailDisplay.classList.remove('empty');
                emailDisplay.classList.add('filled');

                // Focus ke password
                document.getElementById('input-password').focus();

            } catch (e) {
                showError('Login Google gagal: ' + e.message);
            }
        }

        function resetEmailDisplay() {
            googleUser = null;
            const emailDisplay = document.getElementById('email-display');
            document.getElementById('email-text').textContent = 'Klik untuk pilih akun Google';
            document.getElementById('google-badge-text').textContent = 'Pilih';
            emailDisplay.classList.add('empty');
            emailDisplay.classList.remove('filled');
        }

        // ── Toggle password ──
        document.getElementById('toggle-pw-btn').addEventListener('click', () => {
            const inp = document.getElementById('input-password');
            inp.type = inp.type === 'password' ? 'text' : 'password';
        });

        // ── Enter di password → login ──
        document.getElementById('input-password').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') doLogin();
        });

        // ── Tombol login ──
        document.getElementById('login-btn').addEventListener('click', doLogin);

        async function doLogin() {
            if (!googleUser) {
                showError('Pilih akun Google dulu dengan klik kolom email!');
                const emailDisplay = document.getElementById('email-display');
                emailDisplay.classList.add('shake');
                setTimeout(() => emailDisplay.classList.remove('shake'), 500);
                return;
            }

            const pw = document.getElementById('input-password').value;
            if (!pw) {
                showError('Masukkan password admin!');
                document.getElementById('input-password').focus();
                return;
            }

            if (pw !== ADMIN_PASSWORD) {
                showError('Password salah!');
                document.getElementById('input-password').value = '';
                document.getElementById('input-password').classList.add('shake');
                setTimeout(() => document.getElementById('input-password').classList.remove('shake'), 500);
                return;
            }

            setLoading(true);

            sessionStorage.setItem('rti_admin', JSON.stringify({
                name: googleUser.displayName,
                email: googleUser.email,
                photo: googleUser.photoURL
            }));

            setTimeout(() => {
                window.location.href = 'panel.html';
            }, 800);
        }

        function showError(msg) {
            const banner = document.getElementById('error-banner');
            document.getElementById('error-text').textContent = msg;
            banner.classList.remove('hidden');
        }

        function hideError() {
            document.getElementById('error-banner').classList.add('hidden');
        }

        function setLoading(state) {
            const btn = document.getElementById('login-btn');
            document.getElementById('login-btn-text').textContent = state ? 'Masuk...' : 'Masuk ke Panel';
            document.getElementById('login-spinner').classList.toggle('hidden', !state);
            document.getElementById('login-arrow').classList.toggle('hidden', state);
            btn.disabled = state;
        }
    </script>
</body>
</html>
