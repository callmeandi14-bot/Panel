<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTI PANEL — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #060d1a;
            --surface: #0f1e35;
            --border: rgba(255,255,255,0.07);
            --border2: rgba(255,255,255,0.12);
            --accent: #34d399;
            --accent-dim: rgba(52,211,153,0.12);
            --red: #f87171;
            --red-dim: rgba(248,113,113,0.12);
            --text: #e2e8f0;
            --text2: rgba(226,232,240,0.5);
            --text3: rgba(226,232,240,0.25);
            --radius: 16px;
            --radius-sm: 10px;
        }

        html, body {
            height: 100%;
            font-family: 'DM Sans', sans-serif;
            color: var(--text);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            position: relative;
        }

        /* BG grid */
        body::before {
            content: '';
            position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background-image:
                linear-gradient(rgba(52,211,153,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(52,211,153,0.03) 1px, transparent 1px);
            background-size: 48px 48px;
        }
        body::after {
            content: '';
            position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(52,211,153,0.08) 0%, transparent 70%);
        }

        /* Wrapper — INI KUNCI CENTERING */
        .login-wrapper {
            position: relative; z-index: 1;
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
            animation: fadeUp 0.5s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Brand */
        .login-brand {
            display: flex; align-items: center; gap: 14px;
        }
        .brand-icon {
            width: 52px; height: 52px; flex-shrink: 0;
            border-radius: 14px;
            background: var(--accent-dim);
            border: 1px solid rgba(52,211,153,0.2);
            display: flex; align-items: center; justify-content: center;
            color: var(--accent);
        }
        .brand-title {
            font-family: 'Syne', sans-serif;
            font-size: 22px; font-weight: 800;
            color: var(--text); letter-spacing: -0.5px; line-height: 1;
        }
        .brand-title span { color: var(--accent); }
        .brand-sub {
            font-size: 12px; color: var(--text3);
            margin-top: 4px; letter-spacing: 0.5px;
        }

        /* Card */
        .login-card {
            background: var(--surface);
            border: 1px solid var(--border2);
            border-radius: var(--radius);
            padding: 28px;
            box-shadow: 0 24px 60px rgba(0,0,0,0.4);
            width: 100%;
        }
        .login-card-header { margin-bottom: 20px; }
        .login-card-header h2 {
            font-family: 'Syne', sans-serif;
            font-size: 18px; font-weight: 800;
            color: var(--text); letter-spacing: -0.3px;
        }
        .login-card-header p {
            font-size: 13px; color: var(--text2); margin-top: 4px;
        }

        /* Error Banner */
        .error-banner {
            display: flex; align-items: center; gap: 8px;
            background: var(--red-dim);
            border: 1px solid rgba(248,113,113,0.2);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            font-size: 13px; color: var(--red);
            margin-bottom: 16px;
        }
        .error-banner.hidden { display: none; }

        /* Form */
        .login-form { display: flex; flex-direction: column; gap: 14px; }
        .field-group { display: flex; flex-direction: column; gap: 6px; }
        .field-label {
            font-size: 12px; font-weight: 500;
            color: var(--text2); letter-spacing: 0.3px;
        }

        /* Email display */
        .email-display {
            display: flex; align-items: center; gap: 10px;
            padding: 13px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.04);
            font-size: 14px; cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            min-height: 50px; user-select: none;
            width: 100%;
        }
        .email-display:hover {
            border-color: var(--border2);
            background: rgba(255,255,255,0.06);
        }
        .email-display.empty { color: var(--text3); }
        .email-display.filled {
            color: var(--accent);
            border-color: rgba(52,211,153,0.3);
            background: rgba(52,211,153,0.04);
        }
        .email-display .email-text {
            flex: 1; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap;
        }
        .google-badge {
            display: flex; align-items: center; gap: 5px;
            padding: 4px 10px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border2);
            border-radius: 99px;
            font-size: 11px; font-weight: 500;
            color: var(--text2); flex-shrink: 0;
        }

        /* Password field */
        .field-input-wrap {
            position: relative; display: flex; align-items: center;
        }
        .field-icon {
            position: absolute; left: 14px;
            color: var(--text3); pointer-events: none;
        }
        .field-input {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 13px 44px 13px 42px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px; color: var(--text);
            transition: border-color 0.2s, background 0.2s;
            outline: none;
        }
        .field-input::placeholder { color: var(--text3); }
        .field-input:focus {
            border-color: rgba(52,211,153,0.4);
            background: rgba(52,211,153,0.04);
        }
        .toggle-pw-btn {
            position: absolute; right: 14px;
            background: none; border: none;
            color: var(--text3); cursor: pointer;
            transition: color 0.2s; padding: 4px;
            display: flex; align-items: center;
        }
        .toggle-pw-btn:hover { color: var(--text2); }

        /* Login button */
        .login-btn {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%; padding: 14px;
            background: var(--accent);
            border: none; border-radius: var(--radius-sm);
            color: #052e16;
            font-family: 'Syne', sans-serif;
            font-size: 15px; font-weight: 800;
            cursor: pointer; transition: all 0.2s;
            box-shadow: 0 8px 24px rgba(52,211,153,0.25);
            margin-top: 4px;
        }
        .login-btn:hover:not(:disabled) {
            background: #6ee7b7;
            transform: translateY(-1px);
        }
        .login-btn:active:not(:disabled) { transform: scale(0.98); }
        .login-btn:disabled { opacity: 0.7; cursor: not-allowed; }

        .spinner {
            width: 16px; height: 16px;
            border: 2px solid rgba(5,46,22,0.3);
            border-top-color: #052e16;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        .spinner.hidden { display: none !important; }
        .hidden { display: none !important; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .footer-note {
            text-align: center; font-size: 11px;
            color: var(--text3); letter-spacing: 0.3px;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            60% { transform: translateX(6px); }
        }
        .shake { animation: shake 0.4s ease; }

        @media (max-width: 480px) {
            .login-card { padding: 22px 18px; }
        }
    </style>
</head>

                        <input id="input-password" type="password" placeholder="••••••••••" class="field-input">
                        <button id="toggle-pw-btn" class="toggle-pw-btn" type="button">
                            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>

                    </div>

                <!-- Submit -->
                <button id="login-btn" class="login-btn" type="button">
                    <span id="login-btn-text">Masuk ke Panel</span>
                    <div id="login-spinner" class="spinner hidden"></div>
                    <svg id="login-arrow" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">

        <p class="footer-note">RTI Dashboard v1.0 · Akses terbatas untuk admin</p>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

    const app = initializeApp({
        apiKey: "AIzaSyBFbXa_03QYM8DlBkDw7UMZttBMABdtdf4",
        authDomain: "rti-dashboard-7cd8f.firebaseapp.com",
        projectId: "rti-dashboard-7cd8f",
        storageBucket: "rti-dashboard-7cd8f.firebasestorage.app",
        messagingSenderId: "328210653829",
        appId: "1:328210653829:web:2796c8a0995bfdf232bfec"
    });
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    const ADMIN_PASSWORD = "adminrti135";
    const ALLOWED_ADMINS = ["da4389490@gmail.com"];
    let googleUser = null;

    // Klik area email → langsung popup Google
    window.triggerGoogle = async () => {
        try {
            const result = await signInWithPopup(auth, provider);
            const user = result.user;

            if (!ALLOWED_ADMINS.includes(user.email)) {
                await signOut(auth);
                showError('Akun ini tidak memiliki akses admin!');
                return;
            }

            googleUser = user;
            hideError();
            document.getElementById('email-text').textContent = user.email;
            document.getElementById('badge-text').textContent = 'Ganti';
            const d = document.getElementById('email-display');
            d.classList.remove('empty');
            d.classList.add('filled');
            setTimeout(() => document.getElementById('input-password').focus(), 100);

        } catch(e) {
            if (e.code !== 'auth/popup-closed-by-user') {
                showError('Gagal login Google: ' + e.message);
            }
        }
    };

    document.getElementById('toggle-pw-btn').addEventListener('click', () => {
        const inp = document.getElementById('input-password');
        inp.type = inp.type === 'password' ? 'text' : 'password';
    });

    document.getElementById('input-password').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') doLogin();
    });

    document.getElementById('login-btn').addEventListener('click', doLogin);

    async function doLogin() {
        if (!googleUser) {
            showError('Klik kolom email dulu untuk pilih akun Google!');
            document.getElementById('email-display').classList.add('shake');
            setTimeout(() => document.getElementById('email-display').classList.remove('shake'), 500);
            return;
        }
        const pw = document.getElementById('input-password').value;
        if (!pw) { showError('Masukkan password admin!'); return; }
        if (pw !== ADMIN_PASSWORD) {
            showError('Password salah!');
            document.getElementById('input-password').value = '';
            document.getElementById('input-password').classList.add('shake');
            setTimeout(() => document.getElementById('input-password').classList.remove('shake'), 500);
            return;
        }
        setLoading(true);
        sessionStorage.setItem('rti_admin', JSON.stringify({
            name: googleUser.displayName,
            email: googleUser.email,
            photo: googleUser.photoURL
        }));
        setTimeout(() => { window.location.href = 'panel.html'; }, 700);
    }

    function showError(msg) {
        document.getElementById('error-text').textContent = msg;
        document.getElementById('error-banner').classList.remove('hidden');
    }
    function hideError() {
        document.getElementById('error-banner').classList.add('hidden');
    }
    function setLoading(on) {
        document.getElementById('login-btn-text').textContent = on ? 'Masuk...' : 'Masuk ke Panel';
        document.getElementById('login-spinner').classList.toggle('hidden', !on);
        document.getElementById('login-arrow').classList.toggle('hidden', on);
        document.getElementById('login-btn').disabled = on;
    }
    </script>
